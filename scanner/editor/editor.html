<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ScanExtension - Klipp hele PC-en</title>
  <link rel="stylesheet" href="editor.css">
  <link rel="stylesheet" href="../content/content.css">
</head>
<body>
  <div id="editor-container" class="editor-container">
    <img id="editor-bg-img" class="editor-bg-img" alt="Desktop Screenshot">
    <div id="scanext-snip-guide" class="editor-guide-badge">
      🖥️ <b>Klipp hele PC-en:</b> Dra med musen over det området du vil klippe ut (f.eks. andre apper, vinduer, skrivebord). Trykk <kbd>Esc</kbd> for å avbryte.
    </div>
    <div id="scanext-snipper-overlay" class="editor-overlay"></div>
  </div>
  <script src="editor.js"></script>
</body>
</html>
